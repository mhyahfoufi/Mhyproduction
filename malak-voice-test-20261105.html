<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة صوت ملك — MHYPRODUCTION</title><style>body{background:#111;color:#f3e4bd;font-family:system-ui,sans-serif;margin:0;padding:24px}main{max-width:560px;margin:auto}h1{color:#e6bb66}button{padding:16px;border:0;border-radius:12px;background:#d6a54c;color:#17120a;font-size:18px;font-weight:bold;margin:8px 0;cursor:pointer}button:disabled{opacity:.5}textarea{width:100%;box-sizing:border-box;min-height:110px;background:#232323;color:white;border:1px solid #a58b5d;border-radius:10px;padding:12px;font-size:17px}#status{white-space:pre-wrap;padding:12px;background:#252525;border-radius:10px;min-height:60px}small{color:#aaa}audio{width:100%;margin-top:12px}</style></head><body><main><h1>🎙️ تجربة صوت ملك الطبيعي</h1><p>صفحة اختبار مستقلة — لا تغيّر ملك أو الموقع الرسمي.</p><textarea id="txt">مَرْحَبًا بِكَ فِي مَوْقِعِ إِمْ إِتْشْ وَايْ بْرُودَكْشِنْ. أَنَا مَلَكْ، وَيَسْعَدُنِي أَنْ أَتَحَدَّثَ مَعَكَ بِاللُّغَةِ الْعَرَبِيَّةِ.</textarea><p><button id="play">▶ جرّب صوت ملك</button> <button id="stop">■ إيقاف</button></p><div id="status" role="status">جاهز للاختبار. أول تشغيل يحتاج تنزيل النموذج.</div><audio id="audio" controls></audio><p><small>محرّك Nabra مفتوح المصدر. الصوت عربي فصيح؛ جودة النطق على هاتفك لا يمكن ضمانها قبل الاختبار.</small></p></main><script type="module">const $=id=>document.getElementById(id),status=$('status'),play=$('play'),audio=$('audio');let tts,loading,objectUrl;const say=t=>status.textContent=t;$('stop').onclick=()=>{audio.pause();audio.currentTime=0;say('تم إيقاف الصوت')};play.onclick=async()=>{play.disabled=true;try{if(!loading){say('جارٍ تحميل المحرّك...');loading=import('https://cdn.jsdelivr.net/npm/nabra-tts@0.1.0/+esm').then(async m=>{if(!m.NabraTTS)throw Error('لم يتم تحميل NabraTTS');return m.NabraTTS.load({dtype:'fp16',device:'wasm',onProgress:p=>say('تحميل '+p.file+' '+(p.total?Math.round(100*p.loaded/p.total)+'%':''))})}).catch(e=>{loading=null;throw e})}tts=await loading;say('جارٍ توليد الصوت...');const {audio:data}=await tts.generate($('txt').value);if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(tts.toWav(data));audio.src=objectUrl;await audio.play();say('الصوت يعمل الآن — إذا سمعته، نجح الاختبار') }catch(e){say('فشل الاختبار: '+(e.message||e));console.error(e)}finally{play.disabled=false}};audio.onended=()=>say('انتهى تشغيل الصوت');</script></body></html>
