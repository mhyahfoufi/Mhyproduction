name: Library restoration preview checks — no deployment
on:
  push:
    branches: [mhy-library-restore-phase1-20261109]
  pull_request:
    paths: ['media-library/**', 'assets/library-index.js', 'index.html']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test media-library/restore.test.mjs
      - run: npm ci && npm test && node --test public-worker.test.mjs
        working-directory: cloudflare/media-platform-v2
      - name: Ensure this branch has no storage, security or engagement changes
        run: |
          git diff --exit-code a39f864 -- cloudflare/media-platform-v2 media-admin .github/workflows/studio-library-fix.yml
