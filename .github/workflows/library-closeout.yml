name: Library closeout — read-only resource inventory
on:
  push:
    branches: [mhy-postpublish-checks-20261110]
    paths: ['scripts/closure-resources.mjs', '.github/workflows/library-closeout.yml']
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-24.04
    environment: cloudflare-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/closure-resources.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
