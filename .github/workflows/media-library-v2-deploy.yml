name: Protected media library trial deployment
on:
  push:
    branches: [mhy-library-admin-20261107]
    paths:
      - '.github/workflows/media-library-v2-deploy.yml'
      - 'cloudflare/media-platform-v2/deploy-gate.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mhy-media-admin-trial
  cancel-in-progress: false
jobs:
  trial:
    if: github.ref == 'refs/heads/mhy-library-admin-20261107'
    environment: cloudflare-media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test && npm run build
        working-directory: cloudflare/media-platform-v2
      - name: Verify Access, MFA, private bucket and trial target before deployment
        working-directory: cloudflare/media-platform-v2
        run: node deploy-gate.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Owner explicitly confirmed successful Access TOTP login on 2026-11-09.
          MFA_LOGIN_VERIFIED: 'true'
      - name: Deploy trial Worker exclusively
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/media-platform-v2
          wranglerVersion: '4.158.0'
          command: deploy --config release/wrangler.json
