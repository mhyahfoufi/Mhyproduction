name: Media Worker checks and manual deployment
on:
  pull_request:
    paths: ['cloudflare/media-worker/**', '.github/workflows/media-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-worker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cloudflare/media-worker/test.mjs
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    environment: cloudflare-media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure existing R2 binding
        run: node cloudflare/media-worker/configure.mjs
        env:
          MEDIA_BUCKET_NAME: ${{ vars.MEDIA_BUCKET_NAME }}
      - name: Validate account ID without exposing it
        shell: bash
        env:
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const account = (process.env.RAW_ACCOUNT_ID || '').trim();
          if (!/^[a-fA-F0-9]{32}$/.test(account)) {
            console.error('CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID.');
            process.exit(1);
          }
          console.log('::add-mask::' + account);
          appendFileSync(process.env.GITHUB_ENV, 'CF_VALIDATED_ACCOUNT_ID=' + account + '\n');
          NODE
      - name: Deploy existing Worker only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_VALIDATED_ACCOUNT_ID }}
          workingDirectory: cloudflare/media-worker
          wranglerVersion: '4.158.0'
          command: deploy worker.mjs --config wrangler.json
