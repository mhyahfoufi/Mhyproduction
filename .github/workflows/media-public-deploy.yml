name: Publish read-only media gateway
on:
  push:
    branches: [mhy-library-admin-20261107]
    paths:
      - '.github/workflows/media-public-deploy.yml'
      - 'cloudflare/media-platform-v2/public-worker*'
      - 'cloudflare/media-platform-v2/build-public.mjs'
permissions:
  contents: read
concurrency:
  group: mhy-media-public
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/mhy-library-admin-20261107'
    environment: cloudflare-media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test && node --test public-worker.test.mjs && npm run build
        working-directory: cloudflare/media-platform-v2
      - name: Verify existing Access and private R2 without changing them
        working-directory: cloudflare/media-platform-v2
        run: node deploy-gate.mjs && node build-public.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MFA_LOGIN_VERIFIED: 'true'
      - name: Deploy published-media reader only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/media-platform-v2
          wranglerVersion: '4.158.0'
          command: deploy --config public-release/wrangler.json
