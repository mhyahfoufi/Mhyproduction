name: Trial Cloudflare protected repair and preflight
on:
  push:
    branches: [mhy-library-admin-20261107]
    paths:
      - '.github/workflows/media-trial-preflight.yml'
      - 'cloudflare/media-platform-v2/preflight.mjs'
      - 'cloudflare/media-platform-v2/repair-trial.mjs'
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref == 'refs/heads/mhy-library-admin-20261107'
    environment: cloudflare-media
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair incompatible trial MFA selector while preserving owner-only TOTP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID?.trim(),token=process.env.CLOUDFLARE_API_TOKEN?.trim();
          if(process.env.GITHUB_REF!=='refs/heads/mhy-library-admin-20261107'||!/^[a-f0-9]{32}$/i.test(account||'')||!token)throw Error('Missing authorized trial context');
          async function api(path){const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/'+path,{headers:{Authorization:'Bearer '+token}});const d=await r.json().catch(()=>null);if(!r.ok||d?.success!==true){console.log('READ_FAILED '+path.split('?')[0].replace(/[a-f0-9]{24,}/gi,'[id]')+' HTTP='+r.status+' CODES='+(d?.errors||[]).map(x=>Number(x.code)).join(','));return null;}return d.result;}
          const host='mhy-media-admin-trial.mhyprodection.workers.dev';
          const apps=await api('access/apps?per_page=100');
          if(!Array.isArray(apps)||apps.length>=100)throw Error('Incomplete app inventory');
          const matches=apps.filter(a=>a.domain===host||(a.destinations||[]).some(d=>d.type==='public'&&[host,'https://'+host].includes(d.uri)));
          console.log('EXACT_HOST_APPS='+matches.length);
          if(matches.length!==1)throw Error('Ambiguous trial application');
          const app=await api('access/apps/'+matches[0].id);
          const settings=await api('workers/scripts/mhy-media-admin-trial/settings');
          const owner=settings?.bindings?.find(b=>b.name==='ADMIN_EMAIL'&&b.type==='plain_text')?.text?.toLowerCase().trim();
          console.log('TRUSTED_ADMIN_EMAIL_AVAILABLE='+Boolean(owner));
          const ps=await api('access/apps/'+app.id+'/policies');
          if(Array.isArray(ps))for(const p of [...ps].sort((a,b)=>a.precedence-b.precedence)){
           console.log('POLICY='+JSON.stringify({target:p.name==='MHY Admin Only',decision:p.decision,precedence:p.precedence,include:(p.include||[]).map(r=>({selectors:Object.keys(r),ownerEmail:owner&&r.email? r.email.email?.toLowerCase().trim()===owner:undefined,authMethod:r.auth_method?.auth_method})),require:(p.require||[]).map(r=>({selectors:Object.keys(r),authMethod:r.auth_method?.auth_method,ownerEmail:owner&&r.email?r.email.email?.toLowerCase().trim()===owner:undefined})),exclude:(p.exclude||[]).map(r=>({selectors:Object.keys(r),ownerEmail:owner&&r.email?r.email.email?.toLowerCase().trim()===owner:undefined})),approvalRequired:p.approval_required,purposeRequired:p.purpose_justification_required}));
          }
          const idps=await api('access/identity_providers');
          if(Array.isArray(idps))console.log('IDPS='+JSON.stringify(idps.map(p=>({type:p.type,enabledForApp:!(app.allowed_idps?.length)||app.allowed_idps.includes(p.id)}))));
          console.log('APP_AUTH='+JSON.stringify({type:app.type,allowedIdpCount:app.allowed_idps?.length,autoRedirect:app.auto_redirect_to_identity,appLauncherVisible:app.app_launcher_visible}));
          const org=await api('access/organizations');
          console.log('ORG_MFA='+JSON.stringify(org?.mfa_config||null));
          console.log('APP_MFA='+JSON.stringify(app.mfa_config||null));
          for(const p of ps||[]){console.log('POLICY_MFA='+JSON.stringify(p.mfa_config||null));}
          const since=new Date(Date.now()-48*3600000).toISOString(),until=new Date().toISOString();
          const logs=await api('access/logs/access_requests?limit=100&direction=desc&since='+encodeURIComponent(since)+'&until='+encodeURIComponent(until));
          if(Array.isArray(logs)){const relevant=logs.filter(l=>l.app_uid===app.id||l.app_domain===host).sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at));console.log('RECENT_TRIAL_LOG_COUNT='+relevant.length);for(const l of relevant.slice(0,8))console.log('ACCESS_EVENT='+JSON.stringify({time:l.created_at,allowed:l.allowed,action:l.action,ownerMatch:owner?l.user_email?.toLowerCase().trim()===owner:undefined,connectionType:Array.isArray(idps)?idps.find(p=>p.id===l.connection)?.type:undefined,fields:Object.keys(l).filter(k=>!/email|ip|uid|ray|connection/i.test(k))}));}
          console.log('READ_ONLY_AUDIT_COMPLETE; NO_CLOUDFLARE_MUTATIONS; NO_NEW_LOGIN_REQUESTED');
          
          async function write(path,body){
           const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/'+path,{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
           const d=await r.json().catch(()=>null);
           if(!r.ok||d?.success!==true)throw Error('Policy write refused HTTP='+r.status+' codes='+(d?.errors||[]).map(e=>Number(e.code)).join(','));
          }
          const liveApp=await api('access/apps/'+app.id),liveOrg=await api('access/organizations'),livePolicies=await api('access/apps/'+app.id+'/policies');
          if(!owner||!Array.isArray(livePolicies)||livePolicies.length!==1)throw Error('Exclusive owner policy not established');
          const target=livePolicies[0];
          if(target.name!=='MHY Admin Only'||target.decision!=='allow'||target.include?.length!==1||target.include[0].email?.email?.toLowerCase().trim()!==owner||target.exclude?.length)throw Error('Unexpected policy; no mutation');
          const mfa=liveApp?.mfa_config,globalMfa=liveOrg?.mfa_config;
          if(mfa?.mfa_disabled!==false||!mfa.allowed_authenticators?.length||!mfa.allowed_authenticators.every(x=>x==='totp')||!globalMfa?.allowed_authenticators?.includes('totp'))throw Error('Independent TOTP protection not verified');
          if(!Array.isArray(idps)||idps.length!==1||idps[0].type!=='cloudflare')throw Error('Unexpected IdP configuration');
          const required=target.require||[];
          if(required.length!==1||required[0].auth_method?.auth_method!=='mfa')throw Error('Expected unsupported MFA rule absent; no mutation');
          const shared=await api('access/policies/'+target.id);
          if(!shared||shared.app_count!==1)throw Error('Policy is shared or exclusive association unavailable');
          for(const other of apps.filter(a=>a.id!==app.id)){
           const policies=await api('access/apps/'+other.id+'/policies');
           if(!Array.isArray(policies)||policies.some(p=>p.id===target.id))throw Error('Cannot prove exclusive trial association');
          }
          if(shared.decision!=='allow'||JSON.stringify(shared.include)!==JSON.stringify(target.include)||JSON.stringify(shared.require)!==JSON.stringify(target.require))throw Error('Policy changed during audit');
          const body={...shared,require:[],mfa_config:{...mfa}};
          for(const k of ['id','created_at','updated_at','app_count','precedence','reusable'])delete body[k];
          await write('access/policies/'+target.id,body);
          const after=await api('access/apps/'+app.id+'/policies'),sharedAfter=await api('access/policies/'+target.id),appAfter=await api('access/apps/'+app.id),orgAfter=await api('access/organizations');
          const p=after?.find(p=>p.id===target.id);
          const unchangedOwner=p?.decision==='allow'&&JSON.stringify(p.include)===JSON.stringify(target.include)&&JSON.stringify(p.exclude||[])===JSON.stringify(target.exclude||[])&&p.precedence===target.precedence;
          const independentMfa=[p?.mfa_config,sharedAfter?.mfa_config,appAfter?.mfa_config].every(x=>x?.mfa_disabled===false&&x.allowed_authenticators?.length===1&&x.allowed_authenticators[0]==='totp'&&x.session_duration===mfa.session_duration)&&orgAfter?.mfa_config?.allowed_authenticators?.includes('totp');
          if(!unchangedOwner||!independentMfa||p.require?.length||after.length!==1)throw Error('Policy readback failed; do not request login');
          console.log('REPAIR_READBACK='+JSON.stringify({ownerOnly:unchangedOwner,independentTOTPRequired:independentMfa,unsupportedIdpMfaRuleRemoved:true,precedenceUnchanged:true,otherPoliciesAdded:false,bypass:false,everyone:false,liveLoginTested:false,logsReadable:false}));
          NODE
